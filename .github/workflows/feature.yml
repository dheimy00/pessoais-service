name: Feature

on:
  push:
    branches:
      - feature/**

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build app
        run: |
          cd ./app
          mvn install -Dmaven.test.skip=true

      - name: List target directory
        run: |
          ls ./app/target

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run tests
        run: |
          cd ./app
          mvn test -Dmaven.test.skip=true

  feature:
    uses: ./.github/workflows/terraform_init_validate.yml
    needs:
      - build
      - test
    with:
      environment: dev
      aws-assume-role-arn: "arn:aws:iam::788796860262:role/github-actions-dheimy00-pipeline"
      aws-region: "us-east-2"
      aws-statefile-s3-bucket: "dheimy00-us-east-2-terraform-statefiles"
      aws-lock-dynamodb-table: "dheimy00-us-east-2-terraform-lock"
