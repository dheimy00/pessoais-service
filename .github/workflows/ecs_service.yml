name: Check ECS Service Health

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
    secrets:
      aws-access-key-id:
        required: true
      aws-secret-access-key:
        required: true
      aws-region:
        required: true
      cluster_name:
        required: true
      service_name:
        required: true

jobs:
  check-ecs-health:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key }}
          aws-region: ${{ secrets.aws-region }}

      - name: Read destroy configuration
        id: read-destroy-config
        run: |
          ENV="${{ inputs.environment }}"
          if [ -z "$ENV" ]; then
            echo "Error: Environment variable is not set."
            exit 1
          fi
          DESTROY=$(jq -r ".${ENV}" ./infra/destroy_config.json)
          echo "destroy=$DESTROY" >> $GITHUB_OUTPUT

      - name: Check ECS Service Health
        if: steps.read-destroy-config.outputs.destroy != 'true'
        run: |
          CLUSTER_NAME="${{ secrets.cluster_name }}"
          SERVICE_NAME="${{ secrets.service_name }}"

          echo "🔄 Aguardando ECS Service se estabilizar..."

          for i in {1..50}; do
            SERVICE=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" --query "services[0]")
            
            STATUS=$(echo "$SERVICE" | jq -r '.status')
            RUNNING_COUNT=$(echo "$SERVICE" | jq -r '.runningCount')
            DESIRED_COUNT=$(echo "$SERVICE" | jq -r '.desiredCount')
            PRIMARY_STATE=$(echo "$SERVICE" | jq -r '.deployments[] | select(.status=="PRIMARY") | .rolloutState')

            echo "Status: $STATUS | Running: $RUNNING_COUNT/$DESIRED_COUNT | Rollout: $PRIMARY_STATE"

            if [[ "$STATUS" == "ACTIVE" && "$RUNNING_COUNT" -eq "$DESIRED_COUNT" && "$PRIMARY_STATE" == "COMPLETED" ]]; then
              echo "✅ ECS Service está saudável e implantação concluída."
              break
            fi

            echo "⏳ Aguardando estabilização... (tentativa $i)"
            sleep 10
          done

          if [[ "$STATUS" != "ACTIVE" || "$RUNNING_COUNT" -ne "$DESIRED_COUNT" || "$PRIMARY_STATE" != "COMPLETED" ]]; then
            echo "❌ Serviço ECS não estabilizou corretamente."
            echo "📋 Últimos eventos:"
            aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" --query "services[0].events[0:5]" --output table
            exit 1
          fi

          echo "🔍 Verificando falhas em tasks..."

          TASKS=$(aws ecs list-tasks --cluster "$CLUSTER_NAME" --service-name "$SERVICE_NAME" --desired-status RUNNING --query 'taskArns' --output text)

          for TASK in $TASKS; do
            DETAIL=$(aws ecs describe-tasks --cluster "$CLUSTER_NAME" --tasks "$TASK" --query 'tasks[0]')

            HEALTH_STATUS=$(echo "$DETAIL" | jq -r '.containers[0].healthStatus // "UNKNOWN"')
            LAST_EXIT_CODE=$(echo "$DETAIL" | jq -r '.containers[0].exitCode // "N/A"')
            REASON=$(echo "$DETAIL" | jq -r '.containers[0].reason // ""')

            echo "🔸 Task: $TASK"
            echo "  Health: $HEALTH_STATUS"
            echo "  ExitCode: $LAST_EXIT_CODE"
            echo "  Reason: $REASON"

            if [[ "$HEALTH_STATUS" == "UNHEALTHY" || "$LAST_EXIT_CODE" != "0" ]]; then
              echo "❌ Task com falha detectada."
              exit 1
            fi
          done

          echo "✅ Todas as tasks estão saudáveis."
