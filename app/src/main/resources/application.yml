server:
  port: 8080

spring:
  application:
    name: pessoais-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/productsdb?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:productsrds}
    password: ${DB_PASSWORD:products2025}
    driver-class-name: com.mysql.cj.jdbc.Driver

  datasource.hikari:
    pool-name: HikariCP
    maximum-pool-size: 10
    minimum-idle: 5
    idle-timeout: 60000
    max-lifetime: 1800000
    connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false

management:
  server:
    port: 8080
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always